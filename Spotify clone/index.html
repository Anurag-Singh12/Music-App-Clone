<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify Clone</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="utility.css" />
    <link rel="icon" type="image/png" href="img/favicon.ico" />
  </head>
  <body>
    <div class="container flex bg-black">
      <!-- after  making it flex in css (by using utility class) they both comes in row  -->

      <div class="left">
        <!-- left div  -->
        <div class="close">
          <!-- close svg -->
          <img width="30" class="invert" src="img/close.svg" alt="" />
        </div>

        <div class="home bg-grey rounded m-1 p-1">
          <!-- left div's home  -->
          <div class="logo">
            <img class="invert" src="img/logo.svg" alt="" />
          </div>
          <ul>
            <li><img class="invert" src="img/home.svg" alt="Home" />Home</li>
            <li><img class="invert" src="img/search.svg" alt="search" />search</li>
          </ul>
        </div>

        <div class="library bg-grey m-1 rounded p-1">
          <!-- left div's Library playlist  -->

          <div class="heading">
            <img class="invert" src="img/playlist.svg"/>
            <h2>Your library</h2>
          </div>

          <div class="songList">
            <ul>
              <!-- <li>

                        <img class="invert" src="img/music.svg" alt="">
                        <div class="info">
                          <div>Song Name</div>
                          <div>Song Artist</div>
                        </div>

                        <div class="playnow">
                          <span>Play Now</span> 
                        <img class="invert" src="img/play.svg" alt="">
                        </div>

                      </li> -->
            </ul>
          </div>

          <div class="footer">
            <div><a href="https://www.spotify.com/jp/legal/"><span>Legal</span></a></div>
            <div><a href="https://www.spotify.com/jp/privacy/"><span>Privacy Center</span></a></div>
            <div><a href="https://www.spotify.com/jp/legal/privacy-policy/"><span>Privacy Policy</span></a></div>
            <div><a href="https://www.spotify.com/jp/legal/cookies-policy/"><span>Cookies</span></a></div>
            <div><a href="https://www.spotify.com/jp/legal/privacy-policy/#s3"><span>About Ads</span></a></div>
            <div><a href="https://www.spotify.com/jp/accessibility/"><span>Accessibility</span></a></div>
          </div>
        </div>
      </div>

      <!-- right div  -->
      <div class="right rounded bg-grey">
        
        <div class="header">
          <div class="nav">
            <div class="hamburgerContainer">
              <img width="40" class="invert hamburger" src="img/hamburger.svg" alt="">
              <!-- imported direct svg from website-->
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M15 6L9.70711 11.2929C9.37377 11.6262 9.20711 11.7929 9.20711 12C9.20711 12.2071 9.37377 12.3738 9.70711 12.7071L15 18"
                                stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>

                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M9 18L14.2929 12.7071C14.6262 12.3738 14.7929 12.2071 14.7929 12C14.7929 11.7929 14.6262 11.6262 14.2929 11.2929L9 6"
                                stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
            </div>
          </div>

          <div class="buttons">
            <button class="signupbtn">Sign up</button>
            <button class="loginbtn">Log in</button>
          </div>
        </div>

        <div class="spotifyPlaylists">
          <!-- spotify playlist card section  -->
          <h1>Spotify Playlists</h1>
          <div class="cardContainer">
            <div data-folder="Arijit" class="card"> <!-- one card section--> <!--dynamic folder added here-->
              
              <div class="play">  <!--playbutton-->
                <img src="img/play.svg"/>
              </div>
              <img
                src="https://i.scdn.co/image/ab67616d00001e02a7e251b543c77a6ed356dfbe"
                alt="chforur"
              />
              <h2>happy hits</h2>
              <p>hits to boost</p>
            </div>
            <!-- one card section ends-->

            <div data-folder="Punjabi"  class="card"> <!-- second card section-->  <!-- dynamic folder 2-->
              
              <div class="play">
                <img src="img/play.svg" alt="" />
              </div>
              <img
                src="https://i.scdn.co/image/ab67616d00001e02a7e251b543c77a6ed356dfbe"
                alt="chforur"
              />
              <h2>happy hits</h2>
              <p>hits to boost</p>
            </div>
            <!-- secondcard section ends-->
          </div>

          
          <div class="playbar"> <!--playbar section  -->
            
            <div class="seekbar">
              <div class="circle"></div>
            </div>
            <div class="abovebar">
              
              <div class="songinfo"></div>

              <div class="songbuttons">
                <img width="35" id="previous" src="img/previous.svg" alt="" />
                <img width="35" id="play" src="img/play.svg" alt="" />
                <img width="35" id="next" src="img/next.svg" alt="" />
              </div>

              <div class="timevol">
                <div class="songtime"></div>
                <div class="volume">
                  <img width="25" src="img/volume.svg" alt="" />
                  <div class="range">
                    <input type="range" name="volume" id="" />
                    <!--this will give seekbar for vol. inc/low  -->
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
